</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark">

<a class="navbar-brand" href="index.html">

NOUN Appointment Booking

</a>

<span id="welcomeUser" class="text-white">
Welcome, Student
</span>

</div>

</nav>

<div class="container-fluid">

<div class="row">

<!-- Sidebar -->

<div class="col-md-3 bg-light p-4" style="min-height:100vh;">

<h4 class="text-success">Menu</h4>

<hr>

<a href="student-dashboard.html" class="d-block mb-3 text-decoration-none">
<i class="fas fa-home"></i> Dashboard
</a>

<a href="book-appointment.html" class="d-block mb-3 text-decoration-none">
<i class="fas fa-calendar-plus"></i> Book Appointment
</a>

<a href="my-appointments.html" class="d-block mb-3 text-decoration-none">
<i class="fas fa-list"></i> My Appointments

<i class="fas fa-sign-out-alt"></i> Logout

<!-- Main Content -->

<div class="col-md-9 p-4">

<h2>My Profile</h2>

<p>View and update your profile information.</p>

<div class="card">
<div class="card-body">
<form id="profileForm">
<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" class="form-control" id="fullName">
</div>
<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" id="email">
</div>
<div class="mb-3">
<label class="form-label">Phone</label>
<input type="text" class="form-control" id="phone">
</div>
<div class="d-grid">
<button class="btn btn-primary">Save Profile</button>
</div>
 </form>
 </div>
 </div>

</div>

</div>

</div>

<footer>

<p>

© 2026 National Open University of Nigeria | Jos Study Centre

</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/script.js"></script>

<script>
    (async function () {
        try {
            var localUser = sessionStorage.getItem('loggedInUser');
            if (!localUser) {
                var r = await fetch('/api/me', { credentials: 'include' });
                if (!r.ok) return window.location.href = 'login.html';
                var data = await r.json();
                localUser = data.username;
            }
            var el = document.getElementById('welcomeUser');
            if (el) el.textContent = 'Welcome, ' + (localUser || 'Student');

            // Demo fill
            document.getElementById('fullName').value = localUser === 'admin' ? 'Admin User' : '';
            document.getElementById('email').value = localUser === 'admin' ? 'admin@example.com' : '';
        } catch (e) {
            window.location.href = 'login.html';
        }
    })();
</script>

</body>

</html>
