<!-- Main Content -->

<div class="col-md-9 p-4">

<h2>Book Appointment</h2>

<p>Use the form below to request an appointment.</p>

<div class="card">

<div class="card-body">

<form id="bookForm">

<div class="mb-3">
<label class="form-label" for="department">Department</label>
<select id="department" class="form-select" required>
<option>Academic Affairs</option>
<option>Admissions</option>
<option>Finance</option>
</select>
</div>

<div class="mb-3">
<label class="form-label" for="appointmentDate">Appointment Date</label>
<input id="appointmentDate" type="date" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label" for="appointmentTime">Appointment Time</label>
<input id="appointmentTime" type="time" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label" for="purpose">Purpose</label>
<textarea id="purpose" class="form-control" rows="3" required></textarea>
</div>

<div id="bookingMessage" class="alert d-none" role="alert"></div>

<div class="d-grid">
<button type="submit" class="btn btn-success">Request Appointment</button>
</div>

</form>

</div>

</div>

</div>

</div>

</div>

<footer>

<p>

© 2026 National Open University of Nigeria | Jos Study Centre

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/script.js"></script>

<script>
    document.getElementById('bookForm').addEventListener('submit', async function (event) {
        event.preventDefault();
        var message = document.getElementById('bookingMessage');
        var button = this.querySelector('button[type="submit"]');
        button.disabled = true;
        try {
            var response = await fetch('/api/appointments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    date: document.getElementById('appointmentDate').value,
                    time: document.getElementById('appointmentTime').value,
                    department: document.getElementById('department').value,
                    purpose: document.getElementById('purpose').value.trim()
                })
            });
            var data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Unable to submit appointment.');
            message.className = 'alert alert-success';
            message.textContent = 'Appointment request submitted. Status: Pending.';
            this.reset();
        } catch (error) {
            message.className = 'alert alert-danger';
            message.textContent = error.message;
        } finally {
            button.disabled = false;
        }
    });
</script>

<script>
    (async function () {
        try {
            var localUser = sessionStorage.getItem('loggedInUser');
            if (localUser) {
                var el = document.getElementById('welcomeUser');
                if (el) el.textContent = 'Welcome, ' + localUser;
                return;
            }
            var r = await fetch('/api/me', { credentials: 'include' });
            if (!r.ok) {
                window.location.href = 'login.html';
                return;
            }
            var data = await r.json();
            var el = document.getElementById('welcomeUser');
            if (el) el.textContent = 'Welcome, ' + (data.username || 'Student');
        } catch (e) {
            window.location.href = 'login.html';
        }
    })();
</script>
