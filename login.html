<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login | NOUN Appointment Booking System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<!-- Navigation -->

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container">

<a class="navbar-brand" href="index.html">

<img src="assets/images/noun-logo.png.jpg" width="45">

NOUN Appointment Booking

</a>

<div class="ms-auto">

<a href="index.html" class="btn btn-outline-light me-2">

Home

</a>

<a href="register.html" class="btn btn-warning">

Register

</a>

</div>

</div>

</nav>

<!-- Login Form -->

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-5">

<div class="card shadow">

<div class="card-body p-4">

<h2 class="text-center text-success mb-4">

Student Login

</h2>

<form id="loginForm">

<div class="mb-3">

<label>Username</label>

<input
id="username"
type="text"
class="form-control"
placeholder="Enter username">

</div>

<div class="mb-3">

<label>Password</label>

<input
id="password"
type="password"
class="form-control"
placeholder="Enter your password">

</div>

<div id="loginError" class="alert alert-danger d-none" role="alert"></div>

<div class="d-grid">

<button type="submit" class="btn btn-success">

Login

</button>

</div>

</form>

<hr>

<p class="text-center">

Don't have an account?

<a href="register.html">

Create One

</a>

</p>

</div>

</div>

</div>

</div>

</div>

<footer>

<p>

© 2026 National Open University of Nigeria | Jos Study Centre

</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/script.js"></script>

</body>

</html>
