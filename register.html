<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | NOUN Appointment Booking System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="index.html">
            <img src="assets/images/noun-logo.png.jpg" width="45" alt="NOUN Logo">
            NOUN Appointment Booking
        </a>

        <div class="ms-auto">
            <a href="index.html" class="btn btn-outline-light me-2">Home</a>
            <a href="login.html" class="btn btn-warning">Login</a>
        </div>

    </div>
</nav>

<!-- Registration Form -->
<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center text-success mb-4">
                        Student Registration
                    </h2>

                    <form>

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your full name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="example@email.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" placeholder="08012345678">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Matric Number</label>
                            <input type="text" class="form-control" placeholder="NOUN/CSC/24/0001">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Programme</label>

                            <select class="form-select">

                                <option>Select Programme</option>
                                <option>B.Sc Computer Science</option>
                                <option>B.Sc Information Technology</option>
                                <option>B.Sc Business Administration</option>
                                <option>B.Sc Criminology</option>
                                <option>B.Sc Mass Communication</option>

                            </select>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control">
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Create Account
                        </button>

                    </form>

                    <hr>

                    <p class="text-center">
                        Already have an account?
                        <a href="login.html">Login Here</a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Footer -->
<footer>

    <p>
        © 2026 National Open University of Nigeria | Jos Study Centre
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/script.js"></script>

</body>
</html>
