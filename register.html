<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | NOUN Appointment Booking System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="index.html">
            <img src="assets/images/noun-logo.png.jpg" width="45" alt="NOUN Logo">
            NOUN Appointment Booking
        </a>

        <div class="ms-auto">
            <a href="index.html" class="btn btn-outline-light me-2">Home</a>
            <a href="login.html" class="btn btn-warning">Login</a>
        </div>

    </div>
</nav>

<!-- Registration Form -->
<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center text-success mb-4">
                        Student Registration
                    </h2>

                    <form id="registerForm">

                        <div class="mb-3">
                            <label class="form-label" for="username">Username</label>
                            <input id="username" type="text" class="form-control" placeholder="Choose a username" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="fullName">Full Name</label>
                            <input id="fullName" type="text" class="form-control" placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">Email Address</label>
                            <input id="email" type="email" class="form-control" placeholder="example@email.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="phone">Phone Number</label>
                            <input id="phone" type="tel" class="form-control" placeholder="08012345678" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="matricNumber">Matric Number</label>
                            <input id="matricNumber" type="text" class="form-control" placeholder="NOUN/CSC/24/0001" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Programme</label>

                            <select id="programme" class="form-select" required>

                                <option>Select Programme</option>
                                <option>B.Sc Computer Science</option>
                                <option>B.Sc Information Technology</option>
                                <option>B.Sc Business Administration</option>
                                <option>B.Sc Criminology</option>
                                <option>B.Sc Mass Communication</option>

                            </select>

                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input id="password" type="password" class="form-control" minlength="6" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="confirmPassword">Confirm Password</label>
                            <input id="confirmPassword" type="password" class="form-control" minlength="6" required>
                        </div>

                        <div id="registerMessage" class="alert d-none" role="alert"></div>

                        <button type="submit" class="btn btn-success w-100">
                            Create Account
                        </button>

                    </form>

                    <hr>

                    <p class="text-center">
                        Already have an account?
                        <a href="login.html">Login Here</a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Footer -->
<footer>

    <p>
        © 2026 National Open University of Nigeria | Jos Study Centre
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/script.js"></script>

<script>
document.getElementById('registerForm').addEventListener('submit', async function (event) {
    event.preventDefault();
    var message = document.getElementById('registerMessage');
    var password = document.getElementById('password').value;
    if (password !== document.getElementById('confirmPassword').value) {
        message.className = 'alert alert-danger';
        message.textContent = 'Passwords do not match.';
        return;
    }
    try {
        var response = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: password,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                matricNumber: document.getElementById('matricNumber').value,
                programme: document.getElementById('programme').value
            })
        });
        var data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unable to create account.');
        message.className = 'alert alert-success';
        message.textContent = 'Account created successfully. Redirecting to login...';
        setTimeout(function () { window.location.href = 'login.html'; }, 700);
    } catch (error) {
        message.className = 'alert alert-danger';
        message.textContent = error.message;
    }
});
</script>

</body>
</html>
