<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Appointments | NOUN Appointment Booking System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container-fluid">

<a class="navbar-brand" href="index.html">

<img src="assets/images/noun-logo.png.jpg" width="45">

NOUN Appointment Booking

</a>

<span id="welcomeUser" class="text-white">
Welcome, Student
</span>

</div>

</nav>

<div class="container-fluid">

<div class="row">

<!-- Sidebar -->

<div class="col-md-3 bg-light p-4" style="min-height:100vh;">

<h4 class="text-success">Menu</h4>

<hr>

<a href="student-dashboard.html" class="d-block mb-3 text-decoration-none">
<i class="fas fa-home"></i> Dashboard
</a>

<a href="book-appointment.html" class="d-block mb-3 text-decoration-none">
<i class="fas fa-calendar-plus"></i> Book Appointment
</a>

<a href="my-appointments.html" class="d-block mb-3 text-decoration-none">
<i class="fas fa-list"></i> My Appointments
</a>

<a href="profile.html" class="d-block mb-3 text-decoration-none">
<i class="fas fa-user"></i> My Profile
</a>

<a href="notifications.html" class="d-block mb-3 text-decoration-none">
<i class="fas fa-bell"></i> Notifications
<span id="notificationBadge" class="badge bg-danger ms-1">0</span>
</a>

<a href="#" id="logoutLink" class="d-block text-danger text-decoration-none">
<i class="fas fa-sign-out-alt"></i> Logout
</a>

</div>

<!-- Main Content -->

<div class="col-md-9 p-4">

<h2>My Appointments</h2>

<p>List of your appointment requests.</p>

<div class="table-responsive">
<table class="table table-striped">
<thead>
<tr>
<th>#</th>
<th>Department</th>
<th>Date</th>
<th>Status</th>
</tr>
</thead>
<tbody id="appointmentsBody">
<!-- appointments will be rendered here -->
</tbody>
</table>
</div>

</div>

</div>

</div>

<footer>

<p>

© 2026 National Open University of Nigeria | Jos Study Centre

</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/script.js"></script>

<script>
    (async function () {
        try {
            var localUser = sessionStorage.getItem('loggedInUser');
            if (!localUser) {
                var r = await fetch('/api/me', { credentials: 'include' });
                if (!r.ok) return window.location.href = 'login.html';
                var data = await r.json();
                localUser = data.username;
            }
            var el = document.getElementById('welcomeUser');
            if (el) el.textContent = 'Welcome, ' + (localUser || 'Student');

            var tbody = document.getElementById('appointmentsBody');
            var response = await fetch('/api/appointments', { credentials: 'include' });
            var appointments = await response.json();
            document.getElementById('notificationBadge').textContent = appointments.filter(function (a) { return a.studentUnread; }).length;
            appointments.forEach(function (a) {
                var tr = document.createElement('tr');
                tr.innerHTML = '<td>' + a.id + '</td><td>' + a.department + '<br><small>' + a.purpose + '</small></td><td>' + a.date + '<br>' + a.time + '</td><td>' + a.status + (a.remark ? '<br><small>' + a.remark + '</small>' : '') + '</td>';
                tbody.appendChild(tr);
            });
        } catch (e) {
            window.location.href = 'login.html';
        }
    })();
</script>

</body>

</html>
